  a11_mode: recompute_and_compare
  a11_row_unit: criterion_leaf
  a11_status_vocabulary: [PASS, FAIL, NOT EVALUABLE, REPORTED]   # ruling 13 (DL-358) narrows the six words of DL-336 to these four
  a11_new_thresholds: none
  a11_logged_verdict_map:                               # ruling 13 (DL-358): every logged word -> one A11 status word; a word with no entry raises UnmappedVerdict. Words are verbatim from the log, the MS8 evidence sheet and the closes.
    PASS: PASS
    FAIL: FAIL
    FAILED: FAIL
    MEETS: PASS
    DOES NOT MEET: FAIL
    NOT EVALUABLE: NOT EVALUABLE
    NOT INSIDE: FAIL                      # mapping chosen at 11c (UNVERIFIED reading; the ruling gives the rule, not the table): the sigma check range test was not met (a limitation)
    NOT JUDGED: NOT EVALUABLE
    NO VERDICT: NOT EVALUABLE
    NOT IN MS8 RUNS: NOT EVALUABLE
    OPEN: NOT EVALUABLE
    REPORTED: REPORTED
    PASSED: PASS
    "PASSED, continue": PASS
    CONTINUE: REPORTED                    # 11d ruling 2c (DL-368): CONTINUE maps to REPORTED, not PASS (it was PASS at 11c, UNVERIFIED reading)
    PASSED WITH DEPARTURES: PASS          # 11d ruling 2c (DL-368): PASS only with the departures (G6-D1 to G6-D3 and any other logged departure) named in the note column; a11_pass_with_departures_words below
    NOT PASSED: FAIL
  a11_pass_with_departures_words: [PASSED WITH DEPARTURES]   # 11d ruling 2c (DL-368): a row with one of these logged words is refused unless its departures are named (a11_logged `departures`) and they go into the note column
  a11_extra_columns: [rb_id, check_id, source, logged_verdict, recomputed_match, n_evaluated, label, note]    # ruling 14 (DL-359) plus `note` (added at 11c, not in the ruling: UNVERIFIED addition; says why a row was or was not recomputed)
  # ---- D36 ---------------------------------------------------------------------------------------------------------------------------------------
  d36_basis: B
