      classifier: [band_25_100_Hz, threshold_0p1_A_ref] # as frozen
    mode: D                                             # deterministic mean field, kind mf, the run settings of the stored headline record S5ramp_0000_240de3ef73be
    reference_record: S5ramp_0000_240de3ef73be          # the stored 10 ms headline, shown beside each run
    reported: [class, f_pk_hz, f_pk_per_tau, onset_s, eta_onset, duration_s, peak_p_g, peak_rho, J_exit_run]
    statements:
