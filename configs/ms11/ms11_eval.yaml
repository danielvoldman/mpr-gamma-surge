  rb6_network_seeds: 3
  rb6_network_class_claim: none
  rb6_network_time_origin_check: required
  # ---- RB9 ---------------------------------------------------------------------------------------------------------------------------------------
  within_boundary: inclusive                            # ruling 5 (DL-350): "within X" is at most X; "<" and ">" are strict as the plan writes them; ">=" and "<=" inclusive
  rb9a_source: unit_test_level                          # ruling 6 (DL-351): the unit-level test counts, scope stated as a limit; re-run once as an analysis step; no new RB9(a) run
