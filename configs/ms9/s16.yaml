# MS9 9b run config (DL-213 to DL-215; docs/ms9_plan.md "Rulings"). Names the FROZEN criteria file: the runner refuses to start unless the tag criteria-frozen verifies.
# Layered on configs/base.yaml (ref_devalle). Per-run values (cell, T_ramp, eta_start/peak, seed key, perturbation) are in configs/ms9/runlists/*.csv (overrides column).
# S16 (Table 6.2, RB4; M9-11): +-10% one at a time and a 64-point Latin hypercube on eta_start, eta_peak, J0, Delta, tau_d_ms, J_lag_frac, J_T_frac. P2 at the headline cell, explicit eta_start and eta_peak (held at nominal when Delta, tau_d or J0 is perturbed). Point-run keys [7, 9, 1, k] label the records (DL-159, settled).
run:        {id: S16, kind: mf, workers: 1}
model:      {ref_point: ref_devalle}
path:       {name: path_hypoxia, profile: linear, T_ramp_s: 120.0, eta_H: null}
output:     {dir: results/S16}
robustness: {criteria_file: configs/robustness_criteria.yaml}
