# S3 mean field, ref_devalle cells (plan 6.2 S3, 7.1 K8; MS5 step 5d, DL-116): tau_d 5 and 50 ms, 10 s.
# Constant parameters: path I_step with I_amp 0 and t_on 0 (kick delta0 on v at t = 0, D26), hold 10 s.
# Start: Devalle Fig. 3 state, R(0) = S(0) = 5 Hz, V(0) = 0 (run_s3). Outputs: results/S3/devalle/.
# ref_ceni cells (K7) are in configs/S3_ceni.yaml. D25/D26 solver settings as base.yaml; output every 1 ms.
run:      {id: devalle, kind: s3, workers: 2}
model:    {type: M3, ref_point: ref_devalle, tau_ms: 10.0}
path:     {name: I_step, I_amp: 0.0, t_on_s: 0.0}
sweep:    {x_name: model.tau_d_ms, x_values: [5.0, 50.0]}
durations: {hold_s: 10.0}   # baseline_s stays at the base.yaml 5 s and is not used by I_step (t_on 0)
output:   {dir: results/S3}
