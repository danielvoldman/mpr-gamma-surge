# Outputs: results/S3/net_k8/.
run:      {id: net_k8, kind: network, workers: 10}
model:    {type: M3, ref_point: ref_devalle, tau_ms: 10.0, tau_d_ms: 5.0}
path:     {name: I_step, I_amp: 0.0, t_on_s: 0.0}
network:  {N: 50000}
durations: {hold_s: 10.0}
seeds:    {n_seeds: 1}
output:   {dir: results/S3}
