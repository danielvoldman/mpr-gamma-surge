# MS13 13t: journal-export settings (DL-545 J4; superseded in part by DL-554 R1). EVERY VALUE IN THIS FILE IS UNVERIFIED: no journal requirement is claimed.
# Target venue (DL-554 R1): Peer Community Journal (PCJ) after a Peer Community In recommendation. PCJ prefers jpg, tiff or png figures, forbids svg, wmf and emf, states no
# resolution, size or colour rule and places figures in line with the text inside 2.54 cm margins. The MAIN files are a PNG and a flattened TIFF; the PDF is an extra.
# Change a value here and nowhere else; the export code reads this file only.
page:
  main_width_in: 6.3                   # UNVERIFIED: the PCJ template and page size were not read; A4 minus two 2.54 cm margins is 15.9 cm = 6.26 in
  main_max_height_in: 8.0              # UNVERIFIED: so that a caption fits on the page
  double_column_width_in: 7.5          # UNVERIFIED: the second setting for other journals (190 mm), not used by the pilot
  double_column_max_height_in: 8.75    # UNVERIFIED: the second setting for other journals, not used by the pilot
  single_column_width_mm: 84           # UNVERIFIED: the sources disagree whether 84 or 174 mm is the single column; a third setting, not used by the pilot
fs_profile:                            # DL-636 E5 (UNVERIFIED): supplementary figures FS1 to FS3 (13t-4): width as the main figures, a taller page, same text, margin and collision rules
  width_in: 6.3                        # UNVERIFIED: as the main figures
  width_in_by_fig: {FS2: 7.4, FS3: 7.4, FS4: 7.4, FS5: 7.4}   # UNVERIFIED (DL-651 H1): FS2 to FS5 keep the width of their draft; FS1 keeps width_in
  max_height_in: {FS1: 9.5, FS2: 14.4, FS3: 14.4, FS4: 14.4, FS5: 14.4}   # FS1 as built (DL-640); FS2 to FS5 UNVERIFIED limit 14.4 in (DL-651 H1)   # UNVERIFIED: the supplement is a PDF or Zenodo file and no inline page limit was read; a figure that does not fit at 8 pt without touching is stopped and a split proposed (never smaller text)
text:
  min_pt: 8                            # UNVERIFIED: all text at least 8 pt at the FINAL physical size (replaces the draft tick-label rule for the export only)
  title_pt: 8                          # panel titles; not below min_pt
  font_preferred: [Arial, Helvetica]   # used if installed
  font_fallback: DejaVu Sans           # used (and said so in the provenance) if neither preferred font is installed
  pdf_fonttype: 42                     # real (TrueType) fonts embedded, no Type 3
  ps_fonttype: 42
lines:
  min_width_pt: 0.3                    # UNVERIFIED
colour:
  mode: RGB
  allowed_cmaps: [magma, viridis, cividis]      # continuous scales; perceptually uniform, monotone lightness (matplotlib built-ins)
  forbidden_cmaps: [jet, rainbow, hsv, turbo, gist_rainbow, nipy_spectral, gist_ncar]
  min_text_contrast: 4.5               # text against its background (ratio, UNVERIFIED; the WCAG AA figure for normal text)
  min_lightness_difference: 15         # CIELAB L* difference below which two colours count as too close in the greyscale report (UNVERIFIED threshold)
output:
  pdf_dpi: 300                         # UNVERIFIED: dpi of the rasterized parts of the PDF (an extra) and the dpi of the figure object (layout, collision checks). matplotlib has no per-artist dpi
  png_dpi: 600                         # UNVERIFIED default (DL-554 R1): the main PNG
  tiff_dpi: 600                        # UNVERIFIED default (DL-554 R1): the main TIFF, flattened RGB, LZW, no alpha
  tiff: true
  eps: true                            # an extra: kept only if it builds without error and no artist uses transparency (EPS does not carry it)
  forbidden_formats: [svg, wmf, emf]   # PCJ forbids them (DL-554 R1): never written
  pdf_size_flag_mb: 5                  # UNVERIFIED; arXiv and Zenodo limits are to be checked by hand at MS15
  raster_size_flag_mb: 10              # UNVERIFIED (DL-554 R1): a PNG or TIFF above this size is flagged
  rasterize: [spectrogram, spike-count image, spike raster, dense scatter, map cell marks]   # drawn with rasterized=True; text, axes, ticks, lines and legends stay vector
collision:
  pad_pt: 0.5                          # two objects closer than this count as touching (UNVERIFIED)
caption:
  short_max_words: 600                 # UNVERIFIED (DL-615 A6; DL-593 V8 had 330, DL-582 U3 a had 220): the most words of the SHORT caption of a figure (the one for the manuscript); the full caption goes to the supplement
  short_max_words_F1: 650              # UNVERIFIED (DL-628 C6: 600; was 520, DL-615 A6) (DL-615 A6; DL-608 had 480; DL-603 W1; DL-593 V8 had 400, DL-582 U3 a had 280): F1 has eleven panels and a schematic; room for the claim limits and the Parameters sentence (W2)
  short_max_words_F2: 650              # UNVERIFIED (DL-628 C6: 600; was 520, DL-615 A6) (DL-615 A6): F2 (13t-2)
  short_max_words_F3: 650              # UNVERIFIED (DL-628 C6: 600; was 520, DL-615 A6) (DL-615 A6; DL-608 had 480; DL-603 W1; DL-593 V8 had 330)
  short_max_words_F5: 650              # UNVERIFIED (DL-628 C6: 600; was 520, DL-615 A6) (DL-615 A6; DL-608 had 480; DL-603 W1; DL-593 V8 had 330)
  short_max_words_F5c: 650             # UNVERIFIED (DL-628 C6: 600; was 520, DL-615 A6) (DL-615 A6; DL-608 had 480; DL-603 W1; DL-593 V8 had 330)
  short_max_words_FS1: 600             # UNVERIFIED (DL-637; as DL-628 C6)
  short_max_words_FS2: 600             # UNVERIFIED (DL-637)
  short_max_words_FS3: 600             # UNVERIFIED (DL-637)
  short_max_words_F6: 650              # UNVERIFIED (DL-628 C6: 600; was 520, DL-615 A6) (DL-615 A6): F6 (13t-2)
files:
  name_pattern: "^[A-Za-z0-9_+=,.-]+$"   # a-z A-Z 0-9 underscore plus minus dot comma equals; no spaces
