# FINAL CONTENT for the freeze at tag `criteria-frozen`. Robustness criteria (plan Table 7.2, D35; gates G5 to G7, Table 11.2) and the MS7
# classifier / D43 / A4 values. MS7 sub-step 7j (docs/ms7_plan.md). The owner's rulings on docs/ms7_signoff.md are entered (DL-157, DL-159,
# DL-161); the `sheet:` field names the row of that sheet. This is the pre-freeze content commit (DL-161): the tag, the owner's approval entry
# and the SHA-256 of the LF text of this file come later (a file cannot contain its own hash, so meta.freeze_sha256 stays null; the hash is
# in the tag message and in the decision-log entry that follows the tag).
# The one open leaf below (RB8 M4 criteria) is deferred by ruling (F-23); no value was invented for it.
#
# Status of each value (the three labels the owner asked for):
#   logged     = written down in the plan (Table 7.2, Table 11.2, Table 2.1, Appendix B) or in a decision-log entry (source given). Plan
#                numbers marked [needs decision] in the plan (D35) are carried at their plan default and still need the sign-off.
#   UNVERIFIED = no source gives it: ours, or an owner ruling that no source backs. Carried as ruled, labelled.
#   open       = not decided anywhere. `value: null` unless a default is named; the sheet row holds the options.
# Leaf format: key: {value: ..., status: ..., source: ..., sheet: ...}.
#
# This file is read by no run yet. configs/A4.yaml and configs/S5.yaml still point robustness.criteria_file at configs/replication.yaml
# (sheet H-2). The numbers also held in configs/S13.yaml and results/A8/a_ref are checked against it by tests/test_criteria_draft.py.

