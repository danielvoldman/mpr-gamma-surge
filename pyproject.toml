[build-system]
requires = ["setuptools>=64"]   # PEP 660 editable installs
build-backend = "setuptools.build_meta"
[project]
name = "mprsurge"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.17.1",
    "numba==0.68.0",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
    "pandas==3.0.6",
    "pyarrow==26.0.0",
    "pytest==9.1.1",
]
[tool.pytest.ini_options]
markers = ["slow: long-running replication tests"]
addopts = "--strict-markers"
testpaths = ["tests"]
